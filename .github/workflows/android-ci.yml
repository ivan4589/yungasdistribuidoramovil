name: Android validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [fix/android-v1-release-hardening]

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          echo "SDK at ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
      - name: Build and test (no production API operations)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
